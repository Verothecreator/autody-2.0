name: Referral rewards tests
on:
  push:
    branches: [referral-rewards, main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: referral-test-only
          POSTGRES_DB: autody_referral_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev --no-package-lock --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check referrals.js
          node --check public/sign-up.js
          node --check public/account-referrals.js
          node --check public/account-wallet.js
          node --check public/live-account.js
          node --check public/demo-sidebar.js
      - name: Test referral awards, money restrictions and withdrawal rules
        env:
          REFERRAL_TEST_DATABASE_URL: postgresql://postgres:referral-test-only@127.0.0.1:5432/autody_referral_test
        run: node --test tests/referral-*.test.cjs
