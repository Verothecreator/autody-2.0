name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autody-vps-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify automatic VPS deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the VPS to deploy this commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The VPS fetches main every minute. No inbound SSH credential is needed.
          for attempt in $(seq 1 80); do
            if curl --fail --silent --show-error --max-time 15 \
              --resolve autodytraded.com:443:199.192.23.71 \
              https://autodytraded.com/api/deployment/status > /tmp/deployment.json; then
              if python3 -c 'import json,os,sys; s=json.load(open("/tmp/deployment.json")); sys.exit(0 if s.get("commit")==os.environ["EXPECTED_COMMIT"] else 1)'; then
                curl --fail --silent --show-error --max-time 25 \
                  --resolve autodytraded.com:443:199.192.23.71 \
                  https://autodytraded.com/api/db/status > /tmp/database.json
                python3 -c 'import json; s=json.load(open("/tmp/database.json")); assert s.get("success") and s.get("configured") and s.get("provider")=="supabase-postgres", s'
                cat /tmp/deployment.json
                echo 'Autody deployment and database connection verified.'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'VPS did not confirm the expected commit. Check autody-sync.service on the server.' >&2
          exit 1
