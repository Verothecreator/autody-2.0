name: Recover sent Autody briefings

on:
  push:
    paths:
      - .github/workflows/recover-sent-briefings.yml

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Read original sent messages via VPS Resend key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || '162.213.249.146' }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR || vars.VPS_APP_DIR || '/var/www/autody-2.0' }}"
            node - <<'NODE'
            require('dotenv').config();
            const key = process.env.RESEND_API_KEY;
            if (!key) throw new Error('Resend key unavailable on VPS');
            const targets = new Set(['rajpnv02@outlook.com', 'sylvestorrich@gmail.com']);
            (async () => {
              let after = '';
              const found = [];
              for (let page = 0; page < 12; page++) {
                const url = new URL('https://api.resend.com/emails');
                url.searchParams.set('limit', '100');
                if (after) url.searchParams.set('after', after);
                const response = await fetch(url, { headers: { Authorization: 'Bearer ' + key } });
                if (!response.ok) throw new Error('Resend list failed: HTTP ' + response.status);
                const body = await response.json();
                for (const item of body.data || []) {
                  if ((item.to || []).some(x => targets.has(String(x).toLowerCase())) && /Autody market briefing/i.test(item.subject || '')) found.push(item);
                }
                if (!body.has_more || !(body.data || []).length) break;
                after = body.data[body.data.length - 1].id;
              }
              for (const item of found) {
                const response = await fetch('https://api.resend.com/emails/' + encodeURIComponent(item.id), { headers: { Authorization: 'Bearer ' + key } });
                if (!response.ok) { console.log(JSON.stringify({ recipient: item.to, sentAt: item.created_at, error: 'HTTP ' + response.status })); continue; }
                const email = await response.json();
                console.log(JSON.stringify({ recipient: email.to, sentAt: email.created_at, subject: email.subject, text: email.text, html: email.text ? undefined : email.html, id: email.id }));
              }
              console.log('Matching sent briefings:', found.length);
            })().catch(err => { console.error(err.message); process.exitCode = 1; });
            NODE