name: Deploy original briefing and shared watchlist once

on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-original-briefing-once.yml]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Finish checked VPS patch and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || '162.213.249.146' }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR || vars.VPS_APP_DIR || '/var/www/autody-2.0' }}"
            APP_NAME="${{ secrets.PM2_APP_NAME || vars.PM2_APP_NAME || 'autody' }}"
            cd "$APP_DIR"
            git fetch origin main
            rg -q 'async function marketBriefingFollowupDraft' server.js
            rg -q 'original_briefing_text' server.js
            rg -q 'preview-followup' public/admin-marketing.js
            rg -q 'Shared watchlist' public/account-watchlist.html
            rg -q 'Shared watchlist' public/demo-watchlist.html
            python3 - <<'PY'
            import pathlib
            for name in ('server.js', 'public/admin-marketing.html', 'public/admin-marketing.js', 'public/account-watchlist.html', 'public/demo-watchlist.html'):
                file = pathlib.Path(name)
                data = file.read_bytes().replace(b'\r\n', b'\n').rstrip(b'\n') + b'\n'
                file.write_bytes(data)
            print('Normalized changed file line endings')
            PY
            node --check server.js
            node --check public/admin-marketing.js
            git diff --check -- server.js public/admin-marketing.html public/admin-marketing.js public/account-watchlist.html public/demo-watchlist.html
            git add -- server.js public/admin-marketing.html public/admin-marketing.js public/account-watchlist.html public/demo-watchlist.html
            git -c user.name="Autody Deploy" -c user.email="deploy@autodytraded.com" commit --only -m "Reuse original briefing and share watchlists" -- server.js public/admin-marketing.html public/admin-marketing.js public/account-watchlist.html public/demo-watchlist.html
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart "$APP_NAME" --update-env
              pm2 save
            elif command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files | grep -q '^autody.service'; then
              systemctl restart autody
            else
              echo "Autody service was not found"
              exit 1
            fi
            sleep 3
            curl --fail --silent --show-error http://127.0.0.1:3000/api/live/status >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3000/admin-marketing >/dev/null
            echo "Live status and marketing page passed"