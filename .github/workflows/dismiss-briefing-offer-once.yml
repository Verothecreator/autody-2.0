name: Dismiss one existing briefing offer

on:
  workflow_run:
    workflows: ["Deploy VPS"]
    types: [completed]

jobs:
  dismiss:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dismiss this account's briefing suggestion
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || '162.213.249.146' }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR || vars.VPS_APP_DIR || '/var/www/autody-2.0' }}"
            node <<'NODE'
            require('dotenv').config();
            const crypto = require('crypto');
            const fs = require('fs');
            const { Pool } = require('pg');
            const targetHash = 'cf8388a195a611497e93d85195e099713fe28998e51085a4824c8ada76621545';
            const hash = (email) => crypto.createHash('sha256').update(String(email || '').trim().toLowerCase()).digest('hex');
            const dbUrl = process.env.DATABASE_URL || process.env.SUPABASE_DB_URL || process.env.POSTGRES_URL;
            const pool = dbUrl ? new Pool({ connectionString: dbUrl, ssl: process.env.PGSSLMODE === 'disable' ? false : { rejectUnauthorized: false }, max: 1 }) : null;
            (async () => {
              let matchedAccount = false;
              let matchedOffer = false;
              try {
                if (pool) {
                  const profiles = (await pool.query('select id, email from profiles')).rows;
                  const profile = profiles.find((row) => hash(row.email) === targetHash);
                  if (profile) {
                    matchedAccount = true;
                    const count = await pool.query('select count(*)::int as n from watchlists where profile_id = $1 and mode = any($2::text[])', [profile.id, ['demo', 'live']]);
                    console.log('Matched account; saved watchlist rows:', count.rows[0].n);
                  }
                  const leads = (await pool.query('select id, email, watchlist_offer_status from marketing_leads')).rows;
                  const lead = leads.find((row) => hash(row.email) === targetHash);
                  if (lead) {
                    matchedOffer = true;
                    const result = await pool.query("update marketing_leads set watchlist_offer_status = 'dismissed', updated_at = now() where id = $1 returning watchlist_offer_status", [lead.id]);
                    if (result.rows[0]?.watchlist_offer_status !== 'dismissed') throw new Error('Database offer update was not confirmed');
                    console.log('Database briefing offer dismissed');
                  }
                }
                const file = 'data/demo-db.json';
                if (fs.existsSync(file)) {
                  const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                  const user = (data.users || []).find((row) => hash(row.email) === targetHash);
                  const lead = (data.marketingLeads || []).find((row) => hash(row.email) === targetHash);
                  if (user) matchedAccount = true;
                  if (lead) {
                    matchedOffer = true;
                    lead.watchlistOfferStatus = 'dismissed';
                    lead.updatedAt = new Date().toISOString();
                    fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
                    const verified = JSON.parse(fs.readFileSync(file, 'utf8')).marketingLeads.find((row) => hash(row.email) === targetHash);
                    if (verified?.watchlistOfferStatus !== 'dismissed') throw new Error('JSON offer update was not confirmed');
                    console.log('JSON briefing offer dismissed');
                  }
                }
                if (!matchedAccount || !matchedOffer) throw new Error('Target account or briefing offer was not found');
                console.log('Account and offer verified; no watchlist assets changed');
              } finally {
                if (pool) await pool.end();
              }
            })().catch((error) => { console.error(error.message); process.exit(1); });
            NODE
