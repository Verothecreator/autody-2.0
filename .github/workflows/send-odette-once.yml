name: Send approved account watchlist reminder once

on:
  workflow_run:
    workflows: ["Deploy VPS"]
    types: [completed]

jobs:
  send:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_commit.message == 'Dispatch approved account watchlist reminder'
    runs-on: ubuntu-latest
    steps:
      - name: Check pending offer and send approved email
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || '162.213.249.146' }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR || vars.VPS_APP_DIR || '/var/www/autody-2.0' }}"
            node <<'NODE'
            require('dotenv').config();
            const crypto = require('crypto');
            const { Pool } = require('pg');
            const resendKey = process.env.RESEND_API_KEY;
            const dbUrl = process.env.DATABASE_URL || process.env.SUPABASE_DB_URL || process.env.POSTGRES_URL;
            if (!resendKey || !dbUrl) throw new Error('Email delivery or account storage is unavailable');
            const pool = new Pool({ connectionString: dbUrl, ssl: process.env.PGSSLMODE === 'disable' ? false : { rejectUnauthorized: false }, max: 1, connectionTimeoutMillis: 15000 });
            const targetHash = '7c156294d8849570d108ee4b9ae11e76dcded657f8bda35e6747cb4b00c1b289';
            const subject = 'Choose what goes on your Autody watchlist';
            const marketsUrl = 'https://autodytraded.com/account-markets?briefing=review';
            const demoUrl = 'https://autodytraded.com/demo-account';
            (async () => {
              const leads = await pool.query('select id, email, watchlist_offer_status from marketing_leads');
              const lead = leads.rows.find((item) => crypto.createHash('sha256').update(item.email.toLowerCase()).digest('hex') === targetHash);
              if (!lead) throw new Error('The approved contact is unavailable');
              const profile = await pool.query('select id from profiles where lower(email) = lower($1) limit 1', [lead.email]);
              if (!profile.rows.length) throw new Error('The approved contact has no account');
              if (lead.watchlist_offer_status !== 'pending') throw new Error(`Watchlist suggestion is ${lead.watchlist_offer_status || 'unavailable'}; approved invitation was not sent`);
              const text = `Hi Anita,\n\nThe assets from your Autody market briefing are ready as a watchlist suggestion in your account. Take a look and choose whether to add them to your watchlist or decline the suggestion. They won’t be added unless you choose to accept.\n\nReview your briefing assets:\n${marketsUrl}\n\nYour Autody account also includes Demo for practice. It started with $50,000 in Demo funds, giving you room to explore markets and try practice trades. Your Demo funds are separate from your Live account.\n\nOpen Demo:\n${demoUrl}\n\nWe hope Autody helps you keep the markets you care about close.\n\nThe Autody Team`;
              const html = `<div style="font-family:Arial,sans-serif;line-height:1.55;color:#111827;max-width:680px"><div style="font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#5b5cf6;font-weight:800">Autody</div><h1 style="margin:16px 0 10px">Choose what goes on your Autody watchlist</h1><p>Hi Anita,</p><p>The assets from your Autody market briefing are ready as a watchlist suggestion in your account. Take a look and choose whether to add them to your watchlist or decline the suggestion. They won’t be added unless you choose to accept.</p><p>Review your briefing assets:</p><p><a href="${marketsUrl}" style="display:inline-block;padding:12px 18px;background:#5b5fef;color:#fff;text-decoration:none;border-radius:8px;font-weight:700">Review your briefing assets</a></p><p>Your Autody account also includes Demo for practice. It started with $50,000 in Demo funds, giving you room to explore markets and try practice trades. Your Demo funds are separate from your Live account.</p><p>Open Demo:</p><p><a href="${demoUrl}" style="display:inline-block;padding:12px 18px;background:#5b5fef;color:#fff;text-decoration:none;border-radius:8px;font-weight:700">Open Demo</a></p><p>We hope Autody helps you keep the markets you care about close.</p><p>The Autody Team</p></div>`;
              const signingSecret = process.env.MARKETING_SIGNING_SECRET || process.env.AUTODY_ADMIN_SESSION_SECRET || process.env.ADMIN_SESSION_SECRET || process.env.ADMIN_RESET_KEY || process.env.ADMIN_ACCOUNT_PASSWORD_HASH || process.env.ADMIN_ACCOUNT_PASSWORD || resendKey;
              const tokenPayload = Buffer.from(lead.email.toLowerCase()).toString('base64url');
              const tokenSignature = crypto.createHmac('sha256', signingSecret).update(tokenPayload).digest('base64url');
              const unsubscribeUrl = `https://autodytraded.com/marketing/unsubscribe?token=${tokenPayload}.${tokenSignature}`;
              const response = await fetch('https://api.resend.com/emails', {
                method: 'POST',
                headers: { Authorization: `Bearer ${resendKey}`, 'Content-Type': 'application/json', 'Idempotency-Key': `autody-watchlist-demo-once-${lead.id}` },
                body: JSON.stringify({ from: process.env.EMAIL_MARKETS_FROM || 'Autody Markets <markets@autodytraded.com>', to: lead.email, subject, text, html,
                  headers: { 'List-Unsubscribe': `<${unsubscribeUrl}>`, 'List-Unsubscribe-Post': 'List-Unsubscribe=One-Click' } }),
                signal: AbortSignal.timeout(30000)
              });
              const result = await response.json().catch(() => ({}));
              if (!response.ok || !result.id) throw new Error(`Email service rejected the approved message (${response.status}): ${result.message || 'unknown error'}`);
              console.log(`Email service accepted the one-time approved message: ${result.id}`);
            })().catch((error) => { console.error(error.message); process.exitCode = 1; }).finally(() => pool.end());
            NODE
