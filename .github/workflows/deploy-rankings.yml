name: Deploy markets navigation
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-rankings.yml]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Update the market navigation files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || '162.213.249.146' }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR || vars.VPS_APP_DIR || '/var/www/autody-2.0' }}"
            git fetch origin main
            FILES="public/account-markets.html public/account-rankings.html public/demo-sidebar.js public/market-navigation.css"
            PATCH_FILE="/tmp/autody-markets-nav-${{ github.run_id }}.patch"
            git diff --binary c022fd3c4186cc97253a1c27949836af129f837a ${{ github.sha }} -- $FILES > "$PATCH_FILE"
            git apply --check "$PATCH_FILE"
            git branch "markets-nav-backup-${{ github.run_id }}-${{ github.run_attempt }}" HEAD
            git apply "$PATCH_FILE"
            git add -- $FILES
            git -c user.name="Autody Deploy" -c user.email="deploy@autodytraded.com" commit --only -m "Move rankings navigation inside Markets" -- $FILES
            curl --fail --silent --show-error http://127.0.0.1:3000/account-markets | grep -q 'class="market-view-nav"'
