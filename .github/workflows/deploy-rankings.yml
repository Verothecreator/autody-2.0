name: Deploy rankings campaign
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-rankings.yml]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Apply only the reviewed campaign changes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || '162.213.249.146' }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR || vars.VPS_APP_DIR || '/var/www/autody-2.0' }}"
            git fetch origin main
            CAMPAIGN_FILES="public/top-assets.html public/top-assets.css public/top-assets.js public/watchlist-intent.js public/sign-up.html public/sign-up.js public/sign-in.html public/sign-in.js public/verify-email.html public/verify-email.js public/verify-login.html public/verify-login.js"
            PATCH_FILE="/tmp/autody-rankings-${{ github.run_id }}.patch"
            git diff --binary 5bc0e92f3ba86c0e790d44466755857a0736664e 52b08b9bab41befc474f3f3bc0ab065c4d62212a -- $CAMPAIGN_FILES > "$PATCH_FILE"
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
            git add -- $CAMPAIGN_FILES
            git -c user.name="Autody Deploy" -c user.email="deploy@autodytraded.com" commit --only -m "Deploy standalone asset rankings and watchlist return" -- $CAMPAIGN_FILES
            curl --fail --silent --show-error http://127.0.0.1:3000/top-assets | grep -q 'id="asset-rows"'
