<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reply to Autody Support</title>
  <link rel="icon" type="image/png" href="Autody-Logo.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="marketing-support.css" />
</head>
<body class="campaign-body">
  <main class="container support-customer-page">
    <p class="eyebrow">Autody Support</p>
    <h1>Your support conversation</h1>
    <p id="customer-support-topic"></p>
    <section class="app-card" id="customer-support-thread"></section>
    <form class="app-card" id="customer-support-form" hidden>
      <h2>Reply to the team</h2>
      <label>Your message<textarea name="message" rows="6" maxlength="4000" placeholder="Tell us what happened or what else you need." required></textarea></label>
      <button class="btn" type="submit">Send reply</button>
    </form>
    <p class="campaign-status" id="customer-support-notice" role="status"></p>
    <a class="btn btn-ghost" href="/">Back to Autody</a>
  </main>
  <script src="support-reply.js"></script>
</body>
</html>
