<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autody Marketing Leads</title>
  <link rel="icon" type="image/png" href="Autody-Logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-page">
  <main class="container" style="padding:40px 20px 80px">
    <div class="section-heading"><div><p class="eyebrow">Growth control</p><h1>Marketing leads</h1><p>Review consented contacts, segment by interest, export data, and send useful briefings.</p></div><a class="btn btn-ghost" href="ops-console.html">Back to operations</a></div>
    <section class="app-card" style="margin:24px 0">
      <div style="display:grid;grid-template-columns:2fr repeat(2,minmax(150px,1fr));gap:12px">
        <label>Search<input id="lead-search" type="search" placeholder="Email address" /></label>
        <label>Status<select id="lead-status"><option value="">All statuses</option><option>subscribed</option><option>converted</option><option>unsubscribed</option></select></label>
        <label>Interest<select id="lead-interest"><option value="">All interests</option><option>stocks</option><option>crypto</option><option>etfs</option><option>commodities</option><option>economy</option></select></label>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn" id="lead-refresh">Refresh</button><button class="btn btn-ghost" id="lead-export">Export CSV</button><button class="btn btn-ghost" id="lead-send">Send briefing to selected</button></div>
      <p id="lead-notice" class="campaign-status" role="status"></p>
    </section>
    <section class="app-card"><div id="lead-summary" style="margin-bottom:14px"></div><div id="lead-table"></div></section>
  </main>
  <script src="ops-auth.js"></script>
  <script src="admin-marketing.js"></script>
</body>
</html>
